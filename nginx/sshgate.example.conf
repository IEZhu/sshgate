# Add this location to the HTTPS server block of the host that will serve sshgate.
# The secret path is the FIRST factor: keep it long, random and out of the logs.
# install.sh prints a ready-to-paste block with a generated secret already filled in.

location /REPLACE_WITH_LONG_RANDOM_URL_SECRET/ {
    access_log off;                                   # keep the secret out of nginx logs
    proxy_pass http://127.0.0.1:8787/;                # trailing slash: strips the secret prefix
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-Client $remote_addr;      # the app opens the port for THIS ip
    # Behind Cloudflare / another proxy, set the real visitor IP instead, e.g.:
    #   proxy_set_header X-Real-Client $http_cf_connecting_ip;
}
